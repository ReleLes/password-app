<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#07100c">
	<title>KEY//GEN - パスワード生成</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #07100c;
			--surface: #0c1711;
			--line: #20372a;
			--green: #a8ff60;
			--mint: #57e6b1;
			--muted: #8ca294;
			--text: #e7f2e9;
		}

		* { box-sizing: border-box; }

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 28px 20px;
			color: var(--text);
			background-color: var(--bg);
			background-image: linear-gradient(rgba(87, 230, 177, .035) 1px, transparent 1px),
				linear-gradient(90deg, rgba(87, 230, 177, .035) 1px, transparent 1px),
				radial-gradient(ellipse at 50% 42%, #102419 0%, var(--bg) 68%);
			background-size: 40px 40px, 40px 40px, auto;
			font-family: "Yu Gothic UI", "Meiryo", sans-serif;
		}

		.app {
			width: min(100%, 480px);
			animation: reveal .6s ease-out both;
		}

		.topline {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 16px;
			color: var(--muted);
			font: 11px/1.4 Consolas, monospace;
			letter-spacing: 1.5px;
		}

		.signal { color: var(--mint); }

		.panel {
			position: relative;
			padding: clamp(24px, 7vw, 40px);
			overflow: hidden;
			border: 1px solid var(--line);
			background: linear-gradient(145deg, rgba(16, 31, 22, .97), rgba(8, 17, 12, .98));
			box-shadow: 0 24px 80px #0008, 0 0 36px #a8ff600c, inset 0 1px #ffffff08;
		}

		.panel::before {
			position: absolute;
			top: 0;
			left: 40px;
			width: 82px;
			height: 2px;
			background: var(--green);
			box-shadow: 0 0 16px var(--green);
			content: "";
		}

		.eyebrow {
			margin: 0 0 12px;
			color: var(--mint);
			font: 11px/1.5 Consolas, monospace;
			letter-spacing: 2px;
		}

		h1 {
			margin: 0;
			color: var(--green);
			font-size: clamp(27px, 7vw, 34px);
			font-weight: 700;
			line-height: 1.3;
			text-shadow: 0 0 22px #a8ff6038;
		}

		.description {
			margin: 10px 0 28px;
			color: var(--muted);
			font-size: 13px;
			line-height: 1.8;
		}

		.output-label {
			display: flex;
			justify-content: space-between;
			margin-bottom: 9px;
			color: var(--muted);
			font: 10px/1.5 Consolas, monospace;
			letter-spacing: 1.4px;
		}

		.password-box {
			min-height: 62px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 12px 14px 12px 17px;
			border: 1px solid #294434;
			background: #060d09;
		}

		#password {
			min-width: 0;
			overflow-wrap: anywhere;
			color: var(--green);
			font: 17px/1.5 Consolas, "Courier New", monospace;
			letter-spacing: 1px;
		}

		.copy-button {
			flex: 0 0 38px;
			width: 38px;
			height: 38px;
			display: grid;
			place-items: center;
			border: 1px solid #294434;
			color: var(--mint);
			background: #0b1710;
			cursor: pointer;
			transition: border-color .2s, color .2s, background .2s;
		}

		.copy-button:hover:not(:disabled) {
			border-color: var(--mint);
			color: var(--green);
			background: #10251a;
		}

		.copy-button:disabled { opacity: .4; cursor: not-allowed; }
		.copy-button svg { width: 17px; height: 17px; }

		.generate-button {
			width: 100%;
			min-height: 52px;
			margin-top: 16px;
			border: 1px solid var(--green);
			color: #0a130b;
			background: var(--green);
			font: 700 14px/1.4 "Yu Gothic UI", "Meiryo", sans-serif;
			cursor: pointer;
			transition: background .2s, box-shadow .2s, transform .2s;
		}

		.generate-button:hover {
			background: #c1ff8a;
			box-shadow: 0 0 26px #a8ff6038;
			transform: translateY(-1px);
		}

		button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

		.status {
			min-height: 20px;
			margin: 12px 0 0;
			color: var(--mint);
			font-size: 12px;
			text-align: center;
		}

		.footer {
			display: flex;
			justify-content: space-between;
			margin-top: 21px;
			color: #64796a;
			font: 10px/1.5 Consolas, monospace;
			letter-spacing: .8px;
		}

		@keyframes reveal {
			from { opacity: 0; transform: translateY(10px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
		}
	</style>
</head>
<body>
	<main class="app">
		<div class="topline"><span>KEY//GEN</span><span class="signal">● SYSTEM READY</span></div>
		<section class="panel" aria-labelledby="title">
			<p class="eyebrow">SECURE CREDENTIAL TOOL</p>
			<h1 id="title">パスワード生成</h1>
			<p class="description">安全性の高いランダムパスワードを作成します。</p>

			<div class="output-label"><span>生成されたパスワード</span><span>12 CHAR</span></div>
			<div class="password-box">
				<output id="password" aria-live="polite">ここに表示されます</output>
				<button class="copy-button" id="copyButton" type="button" aria-label="パスワードをコピー" title="コピー" disabled>
					<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="1" stroke="currentColor" stroke-width="1.7"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" stroke="currentColor" stroke-width="1.7"/></svg>
				</button>
			</div>
			<button class="generate-button" id="generateButton" type="button">パスワード生成</button>
			<p class="status" id="status" role="status" aria-live="polite"></p>
		</section>
		<footer class="footer"><span>UPPER / LOWER / NUMBER / SYMBOL</span><span>12 CHARACTERS</span></footer>
	</main>

	<script>
		const groups = [
			"ABCDEFGHIJKLMNOPQRSTUVWXYZ",
			"abcdefghijklmnopqrstuvwxyz",
			"0123456789",
			"!@#$%^&*()-_=+[]{}?"
		];
		const allCharacters = groups.join("");
		const passwordOutput = document.querySelector("#password");
		const copyButton = document.querySelector("#copyButton");
		const status = document.querySelector("#status");

		function secureIndex(max) {
			const limit = Math.floor(0x100000000 / max) * max;
			const value = new Uint32Array(1);
			do {
				crypto.getRandomValues(value);
			} while (value[0] >= limit);
			return value[0] % max;
		}

		function generatePassword() {
			const characters = groups.map(group => group[secureIndex(group.length)]);
			while (characters.length < 12) {
				characters.push(allCharacters[secureIndex(allCharacters.length)]);
			}
			for (let index = characters.length - 1; index > 0; index--) {
				const otherIndex = secureIndex(index + 1);
				[characters[index], characters[otherIndex]] = [characters[otherIndex], characters[index]];
			}
			passwordOutput.value = characters.join("");
			copyButton.disabled = false;
			status.textContent = "新しいパスワードを生成しました";
		}

		async function copyPassword() {
			try {
				await navigator.clipboard.writeText(passwordOutput.value);
				status.textContent = "クリップボードにコピーしました";
			} catch {
				const temporaryInput = document.createElement("textarea");
				temporaryInput.value = passwordOutput.value;
				temporaryInput.setAttribute("readonly", "");
				temporaryInput.style.position = "fixed";
				temporaryInput.style.opacity = "0";
				document.body.append(temporaryInput);
				temporaryInput.select();
				const copied = document.execCommand("copy");
				temporaryInput.remove();
				status.textContent = copied ? "クリップボードにコピーしました" : "コピーできませんでした";
			}
		}

		document.querySelector("#generateButton").addEventListener("click", generatePassword);
		copyButton.addEventListener("click", copyPassword);
	</script>
</body>
</html>
